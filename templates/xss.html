{% extends "base.html" %}
{% block title %}Reflected XSS — ShadowNet{% endblock %}
{% block content %}
<section class="section">
  <h2>Reflected XSS</h2>
  <div class="panel">
    <p style="color:var(--text-dim);">This page greets you by name. Try the box below, or edit the <code>?name=</code> parameter in the URL directly.</p>
    <label>Your name</label>
    <form method="get" action="/challenges/xss">
      <input type="text" name="name" value="{{ name }}" placeholder="e.g. Uzan">
      <div style="margin-top:12px;"><button class="btn-mini" type="submit">Say hello</button></div>
    </form>

    <div class="result-render">
      <!-- VULNERABLE: name is injected without escaping -->
      Hello, {{ name|safe }}!
    </div>
  </div>
</section>
{% endblock %}
