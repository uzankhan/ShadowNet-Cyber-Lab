<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Admin Import — ShadowBank</title>
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    <main class="container">
      <h1>Admin Import (XML / Data)</h1>
      <p>This page simulates an admin tool that can import data. Unsafe operations are gated by UNSAFE_MODE.</p>
      <form method="POST" action="/api/admin/import">
        <label for="data">Base64-encoded payload:</label><br>
        <textarea name="payload" id="payload" rows="8" cols="80"></textarea><br>
        <button type="submit">Import</button>
      </form>

      <p><a href="/admin">Back to admin</a></p>
    </main>
  </body>
</html>
