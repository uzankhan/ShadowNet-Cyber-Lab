{% extends "base.html" %}
{% block title %}Hardcoded Secret — ShadowNet{% endblock %}
{% block content %}
<section class="section">
  <h2>Hardcoded Secret</h2>
  <div class="panel">
    <p style="color:var(--text-dim);">There's an admin panel API. It needs an <code>X-Api-Key</code> header. Nobody handed you a key... or did they, months ago, in a JS file?</p>
    <label>X-Api-Key</label>
    <input type="text" id="secret-key" placeholder="paste a key you found">
    <div style="margin-top:12px;"><button class="btn-mini" onclick="tryKey()">Call /api/admin/panel</button></div>
    <div class="output-box" id="secret-out">// response will appear here</div>
  </div>
</section>
<script>
async function tryKey() {
  const key = document.getElementById('secret-key').value;
  const res = await fetch('/api/admin/panel', { headers: { 'X-Api-Key': key } });
  document.getElementById('secret-out').textContent = JSON.stringify(await res.json(), null, 2);
}
</script>
{% endblock %}
