<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ShadowNet Cyber Labs{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <nav class="navbar">
    <a class="brand" href="/"><span class="glyph">0x5H4D0W</span></a>
    <div class="nav-links">
      <a href="/" class="{{ 'active' if active=='home' else '' }}">Home</a>
      <a href="/challenges" class="{{ 'active' if active=='challenges' else '' }}">Challenges</a>
      <a href="/about" class="{{ 'active' if active=='about' else '' }}">About</a>
      <a href="/contact" class="{{ 'active' if active=='contact' else '' }}">Contact</a>
      <a href="/progress">Progress</a>
      <a href="/admin" class="admin-link">🔓 Admin</a>
      <span class="progress-pill" id="progress-pill">{{ captured|length }} / {{ flags|length }} FLAGS</span>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div>ShadowNet Cyber Labs — an intentionally vulnerable training environment. Offline &amp; educational use only.</div>
    <div class="made-by">Made by Uzan Khan</div>
  </footer>

  <form id="flag-submit-form" class="flag-bar" autocomplete="off">
    <input type="text" id="flag-input" placeholder="SHADOWNET{...} — submit a flag you've found">
    <button type="submit">Submit</button>
    <span class="wrong-flash" id="flag-flash"></span>
  </form>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
