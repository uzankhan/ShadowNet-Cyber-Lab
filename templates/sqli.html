{% extends "base.html" %}
{% block title %}SQL Injection — ShadowNet{% endblock %}
{% block content %}
<section class="section">
  <h2>SQL Injection</h2>
  <div class="panel">
    <p style="color:var(--text-dim);">Log in as <code>admin</code> without knowing the password.</p>
    <label>Username</label>
    <input type="text" id="sqli-user" placeholder="admin">
    <label>Password</label>
    <input type="text" id="sqli-pass" placeholder="password">
    <div style="margin-top:12px;"><button class="btn-mini" onclick="tryLogin()">Login</button></div>
    <div class="output-box" id="sqli-out">// response will appear here</div>
  </div>
</section>
<script>
async function tryLogin() {
  const username = document.getElementById('sqli-user').value;
  const password = document.getElementById('sqli-pass').value;
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username, password})
  });
  const data = await res.json();
  document.getElementById('sqli-out').textContent = JSON.stringify(data, null, 2);
}
</script>
{% endblock %}
