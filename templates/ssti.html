{% extends "base.html" %}
{% block title %}SSTI — ShadowNet{% endblock %}
{% block content %}
<section class="section">
  <h2>Server-Side Template Injection</h2>
  <div class="panel">
    <p style="color:var(--text-dim);">Another "greet me by name" page — except this one renders your name AS a Jinja2 template, not just into one.</p>
    <label>Your name</label>
    <form method="get" action="/challenges/ssti">
      <input type="text" name="name" value="{{ raw_name }}" placeholder='try {{ "{{7*7}}" }}'>
      <div style="margin-top:12px;"><button class="btn-mini" type="submit">Say hello</button></div>
    </form>
    <div class="result-render">{{ rendered }}</div>
  </div>
</section>
{% endblock %}
